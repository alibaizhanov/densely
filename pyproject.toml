[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "densely"
version = "0.1.1"
description = "Lossless context compression for LLMs: 2x-8x fewer tokens, byte-exact reconstruction, sha256-verified"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ali Baizhanov" }]
requires-python = ">=3.10"
dependencies = ["tiktoken>=0.7"]
keywords = ["llm", "compression", "context-window", "mcp", "claude", "tokens", "lossless"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Archiving :: Compression",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://densely.dev"
Repository = "https://github.com/alibaizhanov/densely"

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
neural = ["torch>=2.0", "transformers>=4.40", "numpy"]

[project.scripts]
densely = "densely.cli:main"
densely-mcp = "densely.mcp_server:main"
densely-hook = "densely.hook:entry"

[tool.setuptools]
packages = ["densely"]
